schema_version: inputcodex.feature-catalog.v1
release:
  tag: v1.2.43
  tag_commit: 5036ff056b5c629f19356396b17d6eeb70da664c
domain: session-data
features:
  - id: feature.session-data.local-session-directory-observation
    name: '本地会话目录只读观察'
    status: implemented
    evidence:
      - path: upstream/CodexPlusPlus/crates/codex-plus-data/src/storage.rs
        symbol: list_local_sessions
      - path: upstream/CodexPlusPlus/apps/codex-plus-manager/src-tauri/src/commands.rs
        symbol: list_local_sessions
    entry_points:
      - tauri-command:list_local_sessions
    platforms:
      windows:
        applicability: supported
        semantics: '只读观察 CODEX_HOME 或合法非空 CODEX_SQLITE_HOME 下的直接普通 SQLite 候选，最多 32 个；跨库排序去重后分页，默认 50、最大 100，只返回会话 ID、有界标题、截断、归档、更新时间和来源覆盖。'
      macos:
        applicability: supported
        semantics: '只读观察 CODEX_HOME 或合法非空 CODEX_SQLITE_HOME 下的直接普通 SQLite 候选，最多 32 个；跨库排序去重后分页，默认 50、最大 100，只返回会话 ID、有界标题、截断、归档、更新时间和来源覆盖。'
    decision_refs:
      - issue:103
      - issue:104
  - id: feature.session-data.local-session-management
    name: '本地会话与项目管理'
    status: unassessed
    evidence:
      - path: upstream/CodexPlusPlus/crates/codex-plus-core/src/codex_sqlite.rs
        symbol: codex_sqlite
      - path: upstream/CodexPlusPlus/crates/codex-plus-data/src/storage.rs
        symbol: storage
      - path: upstream/CodexPlusPlus/apps/codex-plus-launcher/src/main.rs
        symbol: LauncherDataService::storage_adapter
      - path: upstream/CodexPlusPlus/crates/codex-plus-data/tests/storage_adapter.rs
        symbol: grouped_delete_and_undo
      - path: upstream/CodexPlusPlus/apps/codex-plus-manager/src-tauri/src/commands.rs
        symbol: delete_local_session
    entry_points:
      - core-module:codex_sqlite
      - data-module:storage
      - tauri-command:delete_local_session
    platforms:
      windows:
        applicability: supported
        semantics: '保留合法 CODEX_SQLITE_HOME、多数据库删除、备份、恢复、全库预检和 grouped-undo-token；只读会话目录观察已拆分。'
      macos:
        applicability: supported
        semantics: '保留合法 CODEX_SQLITE_HOME、多数据库删除、备份、恢复、全库预检和 grouped-undo-token；只读会话目录观察已拆分。'
    decision_refs:
      - issue:26
      - issue:38
      - issue:103
      - issue:104
  - id: feature.session-data.markdown-generation
    name: '会话 Markdown 生成'
    status: implemented
    evidence:
      - path: upstream/CodexPlusPlus/crates/codex-plus-data/src/markdown.rs
        symbol: markdown
    entry_points:
      - data-module:markdown
    platforms:
      windows:
        applicability: supported
        semantics: '按既有本地会话 ID 严格只读定位最多 32 个 SQLite 候选与受控 rollout，只生成 user/assistant 文本、不可联网图片占位、UTC 时间戳和固定 LF 的内存 Markdown；消息最多 20,000 条，rollout 与结果各限 16 MiB。'
      macos:
        applicability: supported
        semantics: '按既有本地会话 ID 严格只读定位最多 32 个 SQLite 候选与受控 rollout，只生成 user/assistant 文本、不可联网图片占位、UTC 时间戳和固定 LF 的内存 Markdown；消息最多 20,000 条，rollout 与结果各限 16 MiB。'
    decision_refs:
      - issue:26
      - issue:108
      - issue:109
