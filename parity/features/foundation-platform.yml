      - tauri-command:save_settings
    platforms:
      windows:
        applicability: supported
        semantics: '管理本地设置的底层读写、保存和重置，写入必须原子化并可恢复。'
      macos:
        applicability: supported
        semantics: '管理本地设置的底层读写、保存和重置，写入必须原子化并可恢复。'
    decision_refs:
      - issue:26
      - issue:91
  - id: feature.foundation-platform.version-and-startup
    name: '版本与启动参数'
    status: implemented
    evidence:
      - path: upstream/CodexPlusPlus/crates/codex-plus-core/src/version.rs
        symbol: version
      - path: upstream/CodexPlusPlus/apps/codex-plus-manager/src-tauri/src/commands.rs
        symbol: backend_version
      - path: upstream/CodexPlusPlus/apps/codex-plus-manager/src-tauri/src/commands.rs
        symbol: startup_options
    entry_points:
      - core-module:version
      - tauri-command:backend_version
      - tauri-command:startup_options
    platforms:
      windows:
        applicability: supported
        semantics: '公开由 CARGO_PKG_VERSION 校验得到的 inputcodex 版本；精确 --show-update 或 INPUTCODEX_SHOW_UPDATE=1 产生 StartupIntent::ShowUpdate，否则为 StartupIntent::Default，非法显式值失败。'
      macos:
        applicability: supported
        semantics: '公开由 CARGO_PKG_VERSION 校验得到的 inputcodex 版本；精确 --show-update 或 INPUTCODEX_SHOW_UPDATE=1 产生 StartupIntent::ShowUpdate，否则为 StartupIntent::Default，非法显式值失败。'
    decision_refs:
      - issue:26
      - issue:80
      - issue:81
  - id: feature.foundation-platform.watcher-preference-observation
    name: 'Watcher 偏好状态观察'
    status: implemented
    evidence:
      - path: upstream/CodexPlusPlus/apps/codex-plus-manager/src-tauri/src/commands.rs
        symbol: load_watcher_state
    entry_points:
      - tauri-command:load_watcher_state
    platforms:
      windows:
        applicability: supported
        semantics: '只读检查平台路径定位的 inputcodex_state_root/watcher.disabled 元数据；缺失返回 EnabledByDefault，普通文件返回 ExplicitlyDisabled，不读取内容、写入或控制进程。'
      macos:
        applicability: supported
        semantics: '只读检查平台路径定位的 inputcodex_state_root/watcher.disabled 元数据；缺失返回 EnabledByDefault，普通文件返回 ExplicitlyDisabled，不读取内容、写入或控制进程。'
    decision_refs:
      - issue:26
      - issue:127
      - issue:128
  - id: feature.foundation-platform.watcher-preference-mutation
    name: 'Watcher 偏好固定文件变更'
    status: implemented
    evidence:
      - path: upstream/CodexPlusPlus/apps/codex-plus-manager/src-tauri/src/commands.rs
        symbol: disable_watcher
      - path: upstream/CodexPlusPlus/apps/codex-plus-manager/src-tauri/src/commands.rs
        symbol: enable_watcher
    entry_points:
      - tauri-command:disable_watcher
      - tauri-command:enable_watcher
    platforms:
      windows:
        applicability: supported
        semantics: '在 cooperative-same-user-v1 下校验即时父目录、固定 inputcodex 状态根与 reparse 类型；按 expected/desired 单层创建状态根、原子创建或条件删除 watcher.disabled，提交后重观察并返回 receipt。'
      macos:
        applicability: supported
        semantics: '在 cooperative-same-user-v1 下校验即时父目录、固定 inputcodex 状态根与 symlink 类型；按 expected/desired 单层创建状态根、原子创建或条件删除 watcher.disabled，提交后重观察并返回 receipt。'
    decision_refs:
      - issue:26
      - issue:136
      - issue:140
      - issue:143
  - id: feature.foundation-platform.watcher
    name: 'Watcher 管理'
    status: unassessed
    evidence:
      - path: upstream/CodexPlusPlus/crates/codex-plus-core/src/watcher.rs
        symbol: watcher
      - path: upstream/CodexPlusPlus/crates/codex-plus-core/src/watcher.rs
        symbol: stop_codex_processes_for_debug_port_and_wait
      - path: upstream/CodexPlusPlus/apps/codex-plus-manager/src-tauri/src/commands.rs
        symbol: install_watcher
      - path: upstream/CodexPlusPlus/apps/codex-plus-manager/src-tauri/src/commands.rs
        symbol: uninstall_watcher
    entry_points:
      - core-module:watcher
      - tauri-command:install_watcher
      - tauri-command:uninstall_watcher
    platforms:
      windows:
        applicability: supported
        semantics: '上游 Windows 仍使用粗粒度停止；inputcodex 迁移时必须按目标 debug port 隔离并等待目标进程退出，禁止终止非目标实例。'
      macos:
        applicability: supported
        semantics: '按 remote-debugging-port=<port> 精确筛选 Codex 主进程并排除 Helpers，等待目标进程退出后重启；超时必须留证。'
    decision_refs:
      - issue:26
      - issue:65
