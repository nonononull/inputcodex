schema_version: inputcodex.feature-catalog.v1
release:
  tag: v1.2.44
  tag_commit: 77091ccaee4423f35a1b2c51c4ecd703e6201092
domain: foundation-platform
features:
  - id: feature.foundation-platform.advertising
    name: '广告与推广内容'
    status: exception-pending
    evidence:
      - path: upstream/CodexPlusPlus/crates/codex-plus-core/src/ads.rs
        symbol: ads
      - path: upstream/CodexPlusPlus/apps/codex-plus-manager/src-tauri/src/commands.rs
        symbol: load_ads
    entry_points:
      - core-module:ads
      - tauri-command:load_ads
    platforms:
      windows:
        applicability: exception-pending
        semantics: 'v1.2.44 延续 sponsor、expires_at 和本地素材并更新推广文案；项目禁止广告、推广位和付费导流，仅保留上游证据。'
      macos:
        applicability: exception-pending
        semantics: 'v1.2.44 延续 sponsor、expires_at 和本地素材并更新推广文案；项目禁止广告、推广位和付费导流，仅保留上游证据。'
    decision_refs:
      - issue:26
      - issue:65
      - issue:115
      - rule:AGENTS-product-constraints
  - id: feature.foundation-platform.application-lifecycle
    name: '应用生命周期'
    status: unassessed
    evidence:
      - path: upstream/CodexPlusPlus/crates/codex-plus-core/src/status.rs
        symbol: status
      - path: upstream/CodexPlusPlus/apps/codex-plus-manager/src-tauri/src/commands.rs
        symbol: launch_codex_plus
      - path: upstream/CodexPlusPlus/apps/codex-plus-manager/src-tauri/src/commands.rs
        symbol: restart_codex_plus
      - path: upstream/CodexPlusPlus/apps/codex-plus-launcher/src/main.rs
        symbol: launcher_target_alive
      - path: upstream/CodexPlusPlus/crates/codex-plus-core/src/launcher.rs
        symbol: run_bridge_reinjector
    entry_points:
      - core-module:status
      - tauri-command:launch_codex_plus
      - tauri-command:restart_codex_plus
    platforms:
      windows:
        applicability: supported
        semantics: '启动或重启受管 Codex 进程并维护生命周期状态；Windows 保留端口遇到既有 CDP 时复用可用目标，重注入优先恢复 data bridge；状态文件读写不得冒充实时观察。'
      macos:
        applicability: supported
        semantics: '启动或重启受管 Codex 进程并维护生命周期状态；既有 CDP 恢复与重注入必须保留 data bridge；状态文件读写不得冒充实时观察。'
    decision_refs:
      - issue:26
      - issue:77
      - issue:115
  - id: feature.foundation-platform.application-overview
    name: '应用概览与检测'
    status: implemented
    evidence:
      - path: upstream/CodexPlusPlus/crates/codex-plus-core/src/app_paths.rs
        symbol: codex_app_version
      - path: upstream/CodexPlusPlus/apps/codex-plus-manager/src-tauri/src/commands.rs
        symbol: load_overview
    entry_points:
      - tauri-command:load_overview
    platforms:
      windows:
        applicability: supported
        semantics: '只读采集安装事实、安装版本、inputcodex 构建版本与采集时间；实时进程状态固定为 LiveProcessState::NotObserved。'
      macos:
        applicability: supported
        semantics: '只读采集安装事实、安装版本、inputcodex 构建版本与采集时间；实时进程状态固定为 LiveProcessState::NotObserved。'
    decision_refs:
      - issue:26
      - issue:77
      - issue:78
