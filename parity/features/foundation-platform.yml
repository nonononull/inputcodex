        semantics: '只读观察平台路径解析出的 inputcodex 设置文件；缺失返回 NotConfigured，合法 JSON object 只返回顶层条目数量。'
      macos:
        applicability: supported
        semantics: '只读观察平台路径解析出的 inputcodex 设置文件；缺失返回 NotConfigured，合法 JSON object 只返回顶层条目数量。'
