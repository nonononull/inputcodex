schema_version: inputcodex.feature-catalog.v1
release:
  tag: v1.2.43
  tag_commit: 5036ff056b5c629f19356396b17d6eeb70da664c
domain: foundation-platform
features:
  - id: feature.foundation-platform.advertising
    name: '广告与推广内容'
    status: exception-pending
    evidence:
      - path: upstream/CodexPlusPlus/crates/codex-plus-core/src/ads.rs
        symbol: ads
      - path: upstream/CodexPlusPlus/apps/codex-plus-manager/src-tauri/src/commands.rs
        symbol: load_ads
    entry_points:
      - core-module:ads
      - tauri-command:load_ads
    platforms:
      windows:
        applicability: exception-pending
        semantics: 'v1.2.43 新增 sponsor、expires_at 和本地素材；项目禁止广告、推广位和付费导流，仅保留上游证据。'
      macos:
        applicability: exception-pending
        semantics: 'v1.2.43 新增 sponsor、expires_at 和本地素材；项目禁止广告、推广位和付费导流，仅保留上游证据。'
    decision_refs:
      - issue:26
      - issue:65
      - rule:AGENTS-product-constraints
  - id: feature.foundation-platform.application-lifecycle
    name: '应用生命周期'
    status: unassessed
    evidence:
      - path: upstream/CodexPlusPlus/crates/codex-plus-core/src/status.rs
        symbol: status
      - path: upstream/CodexPlusPlus/apps/codex-plus-manager/src-tauri/src/commands.rs
        symbol: launch_codex_plus
      - path: upstream/CodexPlusPlus/apps/codex-plus-manager/src-tauri/src/commands.rs
        symbol: restart_codex_plus
    entry_points:
      - core-module:status
      - tauri-command:launch_codex_plus
      - tauri-command:restart_codex_plus
    platforms:
      windows:
        applicability: supported
        semantics: '启动或重启受管 Codex 进程并维护生命周期状态；状态文件读写不得冒充应用概览的实时进程观察。'
      macos:
        applicability: supported
        semantics: '启动或重启受管 Codex 进程并维护生命周期状态；状态文件读写不得冒充应用概览的实时进程观察。'
    decision_refs:
      - issue:26
      - issue:77
  - id: feature.foundation-platform.application-overview
    name: '应用概览与检测'
    status: implemented
    evidence:
      - path: upstream/CodexPlusPlus/crates/codex-plus-core/src/app_paths.rs
        symbol: codex_app_version
      - path: upstream/CodexPlusPlus/apps/codex-plus-manager/src-tauri/src/commands.rs
        symbol: load_overview
    entry_points:
      - tauri-command:load_overview
    platforms:
      windows:
        applicability: supported
        semantics: '只读采集安装事实、安装版本、inputcodex 构建版本与采集时间；实时进程状态固定为 LiveProcessState::NotObserved。'
      macos:
        applicability: supported
        semantics: '只读采集安装事实、安装版本、inputcodex 构建版本与采集时间；实时进程状态固定为 LiveProcessState::NotObserved。'
    decision_refs:
      - issue:26
      - issue:77
      - issue:78
  - id: feature.foundation-platform.diagnostics
    name: '日志与诊断'
    status: unassessed
    evidence:
      - path: upstream/CodexPlusPlus/crates/codex-plus-core/src/diagnostic_log.rs
        symbol: diagnostic_log
      - path: upstream/CodexPlusPlus/apps/codex-plus-manager/src-tauri/src/commands.rs
        symbol: clear_logs
      - path: upstream/CodexPlusPlus/apps/codex-plus-manager/src-tauri/src/commands.rs
        symbol: copy_diagnostics
      - path: upstream/CodexPlusPlus/apps/codex-plus-manager/src-tauri/src/commands.rs
        symbol: read_latest_logs
      - path: upstream/CodexPlusPlus/apps/codex-plus-manager/src-tauri/src/commands.rs
        symbol: write_diagnostic_event
    entry_points:
      - core-module:diagnostic_log
      - tauri-command:clear_logs
      - tauri-command:copy_diagnostics
      - tauri-command:read_latest_logs
      - tauri-command:write_diagnostic_event
    platforms:
      windows:
        applicability: supported
        semantics: '读取、清理和复制诊断材料，必须脱敏并限制数据边界。'
      macos:
        applicability: supported
        semantics: '读取、清理和复制诊断材料，必须脱敏并限制数据边界。'
    decision_refs:
      - issue:26
  - id: feature.foundation-platform.environment-conflicts
    name: '环境冲突检查'
    status: unassessed
    evidence:
      - path: upstream/CodexPlusPlus/crates/codex-plus-core/src/env_conflicts.rs
        symbol: env_conflicts
      - path: upstream/CodexPlusPlus/apps/codex-plus-manager/src-tauri/src/commands.rs
        symbol: remove_env_conflicts
    entry_points:
      - core-module:env_conflicts
      - tauri-command:remove_env_conflicts
    platforms:
      windows:
        applicability: supported
        semantics: '检测并按明确授权清理冲突环境配置，默认只读并保留证据。'
      macos:
        applicability: supported
        semantics: '检测并按明确授权清理冲突环境配置，默认只读并保留证据。'
    decision_refs:
      - issue:26
      - issue:85
  - id: feature.foundation-platform.runtime-environment-conflict-observation
    name: '运行时环境冲突观察'
    status: implemented
    evidence:
      - path: upstream/CodexPlusPlus/crates/codex-plus-core/src/env_conflicts.rs
        symbol: detected_env_conflicts_from_pairs
      - path: upstream/CodexPlusPlus/apps/codex-plus-manager/src-tauri/src/commands.rs
        symbol: check_env_conflicts
    entry_points:
      - tauri-command:check_env_conflicts
    platforms:
      windows:
        applicability: supported
        semantics: '只读观察当前进程继承的 OPENAI_* 环境变量名称和值存在性；名称大小写不敏感并规范为大写，持久化用户与系统来源明确标记为 NotObserved。'
      macos:
        applicability: supported
        semantics: '只读观察当前进程继承的 OPENAI_* 环境变量名称和值存在性；名称大小写敏感并保留原名，持久化用户与系统来源明确标记为 NotObserved。'
    decision_refs:
      - issue:26
      - issue:85
      - issue:86
  - id: feature.foundation-platform.platform-paths
    name: '平台路径解析'
    status: implemented
    evidence:
      - path: upstream/CodexPlusPlus/crates/codex-plus-core/src/app_paths.rs
        symbol: app_paths
      - path: upstream/CodexPlusPlus/crates/codex-plus-core/src/codex_home.rs
        symbol: codex_home
      - path: upstream/CodexPlusPlus/crates/codex-plus-core/src/paths.rs
        symbol: paths
    entry_points:
      - core-module:app_paths
      - core-module:codex_home
      - core-module:paths
    platforms:
      windows:
        applicability: supported
        semantics: '识别 OpenAI.Codex 与 OpenAI.ChatGPT-Desktop Windows 包身份并解析等价路径，不暴露私人绝对路径。'
      macos:
        applicability: supported
        semantics: '解析与 Windows 等价的应用和数据路径，不依赖 Windows 包身份且不暴露私人绝对路径。'
    decision_refs:
      - issue:26
      - issue:38
      - issue:74
      - issue:75
  - id: feature.foundation-platform.settings-management
    name: '设置管理'
    status: unassessed
    evidence:
      - path: upstream/CodexPlusPlus/crates/codex-plus-core/src/settings.rs
        symbol: settings
      - path: upstream/CodexPlusPlus/apps/codex-plus-manager/src-tauri/src/commands.rs
        symbol: load_settings
      - path: upstream/CodexPlusPlus/apps/codex-plus-manager/src-tauri/src/commands.rs
        symbol: reset_settings
      - path: upstream/CodexPlusPlus/apps/codex-plus-manager/src-tauri/src/commands.rs
        symbol: save_settings
    entry_points:
      - core-module:settings
      - tauri-command:load_settings
      - tauri-command:reset_settings
      - tauri-command:save_settings
    platforms:
      windows:
        applicability: supported
        semantics: '加载、保存和重置本地设置，写入必须原子化并可恢复。'
      macos:
        applicability: supported
        semantics: '加载、保存和重置本地设置，写入必须原子化并可恢复。'
    decision_refs:
      - issue:26
  - id: feature.foundation-platform.version-and-startup
    name: '版本与启动参数'
    status: implemented
    evidence:
      - path: upstream/CodexPlusPlus/crates/codex-plus-core/src/version.rs
        symbol: version
      - path: upstream/CodexPlusPlus/apps/codex-plus-manager/src-tauri/src/commands.rs
        symbol: backend_version
      - path: upstream/CodexPlusPlus/apps/codex-plus-manager/src-tauri/src/commands.rs
        symbol: startup_options
    entry_points:
      - core-module:version
      - tauri-command:backend_version
      - tauri-command:startup_options
    platforms:
      windows:
        applicability: supported
        semantics: '公开由 CARGO_PKG_VERSION 校验得到的 inputcodex 版本；精确 --show-update 或 INPUTCODEX_SHOW_UPDATE=1 产生 StartupIntent::ShowUpdate，否则为 StartupIntent::Default，非法显式值失败。'
      macos:
        applicability: supported
        semantics: '公开由 CARGO_PKG_VERSION 校验得到的 inputcodex 版本；精确 --show-update 或 INPUTCODEX_SHOW_UPDATE=1 产生 StartupIntent::ShowUpdate，否则为 StartupIntent::Default，非法显式值失败。'
    decision_refs:
      - issue:26
      - issue:80
      - issue:81
  - id: feature.foundation-platform.watcher
    name: 'Watcher 管理'
    status: unassessed
    evidence:
      - path: upstream/CodexPlusPlus/crates/codex-plus-core/src/watcher.rs
        symbol: watcher
      - path: upstream/CodexPlusPlus/crates/codex-plus-core/src/watcher.rs
        symbol: stop_codex_processes_for_debug_port_and_wait
      - path: upstream/CodexPlusPlus/apps/codex-plus-manager/src-tauri/src/commands.rs
        symbol: disable_watcher
      - path: upstream/CodexPlusPlus/apps/codex-plus-manager/src-tauri/src/commands.rs
        symbol: enable_watcher
      - path: upstream/CodexPlusPlus/apps/codex-plus-manager/src-tauri/src/commands.rs
        symbol: install_watcher
      - path: upstream/CodexPlusPlus/apps/codex-plus-manager/src-tauri/src/commands.rs
        symbol: load_watcher_state
      - path: upstream/CodexPlusPlus/apps/codex-plus-manager/src-tauri/src/commands.rs
        symbol: uninstall_watcher
    entry_points:
      - core-module:watcher
      - tauri-command:disable_watcher
      - tauri-command:enable_watcher
      - tauri-command:install_watcher
      - tauri-command:load_watcher_state
      - tauri-command:uninstall_watcher
    platforms:
      windows:
        applicability: supported
        semantics: '上游 Windows 仍使用粗粒度停止；inputcodex 迁移时必须按目标 debug port 隔离并等待目标进程退出，禁止终止非目标实例。'
      macos:
        applicability: supported
        semantics: '按 remote-debugging-port=<port> 精确筛选 Codex 主进程并排除 Helpers，等待目标进程退出后重启；超时必须留证。'
    decision_refs:
      - issue:26
      - issue:65
