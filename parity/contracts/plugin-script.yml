schema_version: inputcodex.behavior-contract.v1
domain: plugin-script
contracts:
  - id: contract.feature.plugin-script.dream-skin-library.baseline
    feature_id: feature.plugin-script.dream-skin-library
    scenario: baseline
    preconditions:
      - '上游 Release v1.2.42 证据已锁定，所需平台适配器可用。'
    inputs:
      - name: request
        data_type: dream-skin-library-request
        required: false
        description: '结构化请求；可包含本地主题元数据、图片引用与可选 companion 配置。'
      - name: companion
        data_type: optional-dream-skin-companion
        required: false
        description: 'data URL 仅允许 data:image/png;base64、data:image/jpeg;base64、data:image/webp;base64 或 data:image/gif;base64，并可声明宽度、侧边与偏移。'
    outputs:
      - name: result
        data_type: dream-skin-library-result
        description: '返回可持久化的本地主题与受限 companion 配置；不返回或执行注入式显示状态。'
    side_effects:
      - filesystem-read
      - filesystem-write
    persistence: '主题与受限 companion 配置原子写入本地库；失败不得留下半成品、外部 URL、凭据或注入脚本。'
    errors:
      - code: DREAM_SKIN_LIBRARY_FAILED
        kind: feature
        semantics: 'Dream Skin 本地主题库失败时返回稳定错误分类，不伪造空成功。'
      - code: DREAM_SKIN_COMPANION_INVALID
        kind: validation
        semantics: 'companion 缺少 data URL、MIME/base64 不受支持、宽度或偏移非法时拒绝保存，不降级为可执行 HTML 或远程 URL。'
    loading:
      states: [Idle, Loading, Ready, Empty, Failed, Cancelling]
      request_identity: '每次Dream Skin 本地主题库请求使用唯一递增标识。'
      stale_result_rule: 旧请求结果不得覆盖更新请求的状态或数据。
    timeout:
      behavior: 超时后进入 Failed，终止本次工作并保留稳定错误分类。
      evidence: 记录请求标识、耗时和错误类别，不记录凭据或私人路径。
    cancellation:
      behavior: 取消后进入 Cancelling，完成清理后回到 Idle，旧结果失效。
      evidence: 记录取消请求、清理完成和旧请求失效。
    isolation: 'Dream Skin 本地主题库单次失败不得污染其他 feature、请求或稳定状态。'
    observability:
      - request_identity
      - duration_ms
      - outcome_class
    platforms:
      shared_semantics: '两端等价保存本地图片、主题与受限 companion 配置；companion 显示仍依赖 renderer 注入，因此不在本合同执行。'
      windows: 使用 Windows 平台适配器遵循共享语义；不支持时明确失败。
      macos: 使用 macOS 平台适配器遵循共享语义；不支持时明确失败。
      differences: []
    fixture_policy:
      mode: required
      reason: '使用合成 data URL 和布局参数固定 companion 配置结构，不包含真实图片、远程 URL 或用户路径。'
    fixture_refs:
      - fixture.feature.plugin-script.dream-skin-library.baseline
  - id: contract.feature.plugin-script.dream-skin-marketplace.baseline
    feature_id: feature.plugin-script.dream-skin-marketplace
    scenario: baseline
    preconditions:
      - '独立 parity-exception 尚未获得项目所有者决定。'
    inputs:
      - name: decision_ref
        data_type: decision-reference
        required: false
        description: '可选的一致性例外决定引用；缺失时保持 pending。'
    outputs:
      - name: exception_status
