        semantics: 'Watcher 管理、目标进程终止或等待旧进程退出失败时返回稳定错误分类，不伪造空成功。'
    loading:
      states: [Idle, Loading, Ready, Empty, Failed, Cancelling]
      request_identity: '每次Watcher 管理请求使用唯一递增标识。'
      stale_result_rule: 旧请求结果不得覆盖更新请求的状态或数据。
    timeout:
      behavior: 等待旧进程退出超时后进入 Failed，不启动替代进程并保留稳定错误分类。
      evidence: 记录 debug port、目标进程数、剩余进程数、耗时和错误类别，不记录凭据或私人路径。
    cancellation:
      behavior: 取消后进入 Cancelling，完成清理后回到 Idle，旧结果失效。
      evidence: 记录取消请求、清理完成和旧请求失效。
    isolation: 'Watcher 只能控制目标 debug port 对应的主进程，必须排除 helper 和非目标实例；单次失败不得污染其他 feature、请求或稳定状态。'
    observability:
      - request_identity
      - debug_port
      - target_process_count
      - remaining_process_count
      - duration_ms
      - outcome_class
    platforms:
      shared_semantics: '重启只处理目标实例，等待旧进程退出并对超时留证；不得把上游平台差异带入 inputcodex。'
      windows: '上游 v1.2.43 仍为粗粒度停止；inputcodex 实现前必须补齐与 macOS 等价的目标隔离。'
      macos: '按 remote-debugging-port 精确筛选 Codex 主进程，排除 Helpers，等待退出后再重启。'
      differences:
        - '上游 v1.2.43 仅 macOS 按 debug port 精确筛选；该差异不得成为 inputcodex 产品差异。'
    fixture_policy:
      mode: none
      reason: '基线只约束状态、副作用和错误语义，不需要结构样本。'
    fixture_refs: []
