      macos: 使用 macOS 平台适配器遵循共享语义；不支持时明确失败。
      differences: []
    fixture_policy:
      mode: required
      reason: '使用合成 fixture 固定结构字段、边界值与引用关系。'
    fixture_refs:
      - fixture.feature.session-data.markdown-export.baseline
  - id: contract.feature.session-data.provider-metadata-maintenance.baseline
    feature_id: feature.session-data.provider-metadata-maintenance
    scenario: baseline
    preconditions:
      - '上游 Release v1.2.43 证据已锁定，所需平台适配器可用。'
    inputs:
      - name: request
        data_type: provider-metadata-maintenance-request
        required: false
        description: '结构化请求；无参数时为空对象。'
    outputs:
      - name: result
        data_type: provider-metadata-maintenance-result
        description: 'Provider 元数据维护、SQLite catalog 修复与同步状态维护的稳定结果或明确空结果。'
      - name: sqlite_catalog_rows_inserted
        data_type: non-negative-integer
        description: '从 threads 修复到 local_thread_catalog 的新增行数，对外映射为 sqliteCatalogRowsInserted。'
      - name: catalog_sync_state
        data_type: provider-catalog-sync-state
        description: '包含 watermark、initial_build_complete 和 observation_sequence 的同步状态。'
    side_effects:
      - database-read
      - database-write
      - filesystem-write
    persistence: 'local_thread_catalog 与同步状态写入必须同事务提交，失败回滚且不删除原始 threads 数据。'
    errors:
      - code: PROVIDER_METADATA_MAINTENANCE_FAILED
        kind: feature
        semantics: 'Provider 元数据维护、catalog 修复或同步状态写入失败时返回稳定错误分类，不伪造空成功或错误计数。'
    loading:
      states: [Idle, Loading, Ready, Empty, Failed, Cancelling]
      request_identity: '每次Provider 元数据维护请求使用唯一递增标识。'
      stale_result_rule: 旧请求结果不得覆盖更新请求的状态或数据。
    timeout:
      behavior: 超时后进入 Failed，终止本次工作并保留稳定错误分类。
      evidence: 记录请求标识、耗时和错误类别，不记录凭据或私人路径。
    cancellation:
      behavior: 取消后进入 Cancelling，完成清理后回到 Idle，旧结果失效。
      evidence: 记录取消请求、清理完成和旧请求失效。
    isolation: 'Provider 元数据维护单次失败不得污染其他 feature、请求或稳定状态。'
    observability:
      - request_identity
      - sqlite_catalog_rows_inserted
      - observation_sequence
      - duration_ms
      - outcome_class
    platforms:
      shared_semantics: '同步 metadata、从 threads 修复 local_thread_catalog、返回 sqlite_catalog_rows_inserted、维护 observation_sequence 并生成本地备份。'
      windows: 使用 Windows 平台适配器遵循共享语义；不支持时明确失败。
      macos: 使用 macOS 平台适配器遵循共享语义；不支持时明确失败。
      differences: []
    fixture_policy:
      mode: required
      reason: '使用合成 fixture 固定结构字段、边界值与引用关系。'
    fixture_refs:
      - fixture.feature.session-data.provider-metadata-maintenance.baseline
