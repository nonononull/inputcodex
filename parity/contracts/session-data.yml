schema_version: inputcodex.behavior-contract.v1
domain: session-data
contracts:
  - id: contract.feature.session-data.local-session-directory-observation.baseline
    feature_id: feature.session-data.local-session-directory-observation
    scenario: baseline
    preconditions:
      - '上游 Release v1.2.44 证据已锁定，Windows 或 macOS 平台路径适配器可用。'
    inputs:
      - name: request
        data_type: local-session-directory-request
        required: false
        description: '可选 offset 与 limit；默认 offset 为 0、limit 为 50，limit 最大 100。'
    outputs:
      - name: completion
        data_type: LoadCompletion<LocalSessionDirectoryPage>
        description: '有条目返回 LoadCompletion::Ready，无来源或全部可读来源为空返回 LoadCompletion::Empty，不能形成可信结果时返回 LoadCompletion::Failed。'
      - name: page
        data_type: local-session-directory-page
        description: '页面只含 session_id、display_title、title_truncated、archived、updated_at_ms、offset、limit、has_more 和 Complete 或 Partial 来源覆盖。'
    side_effects:
      - filesystem-read
      - database-read
    persistence: 'none'
    errors:
      - code: LOCAL_SESSION_DIRECTORY_INVALID_PAGINATION
        kind: validation
        semantics: 'limit 为 0、超过最大 100 或 offset、limit 与探测行组合溢出时明确失败。'
      - code: LOCAL_SESSION_DIRECTORY_INVALID_SQLITE_HOME
        kind: validation
        semantics: '非空显式 CODEX_SQLITE_HOME 不是合法受支持目录时失败且不得回退。'
      - code: LOCAL_SESSION_DIRECTORY_TOO_MANY_DATABASES
        kind: policy
        semantics: '直接普通 SQLite 候选超过 32 个时在打开数据库前失败。'
      - code: LOCAL_SESSION_DIRECTORY_UNSUPPORTED_SCHEMA
        kind: validation
        semantics: '来源不具备受支持 threads 或 automation_runs 最小 schema 时按来源失败处理。'
      - code: LOCAL_SESSION_DIRECTORY_UNAVAILABLE
        kind: feature
        semantics: '目录枚举、文件门禁、数据库打开、锁等待或查询失败时返回脱敏不可用错误。'
      - code: LOCAL_SESSION_DIRECTORY_TIMEOUT
        kind: feature
        semantics: '整体 deadline 到期时停止当前观察并返回稳定超时错误。'
      - code: LOCAL_SESSION_DIRECTORY_CANCELLED
        kind: feature
        semantics: '取消标记生效后停止当前观察，旧请求结果不得发布。'
      - code: LOCAL_SESSION_DIRECTORY_UNSUPPORTED
        kind: platform
        semantics: '非 Windows 与 macOS 平台调用系统适配器时明确报告不支持。'
      - code: USER_HOME_UNAVAILABLE
        kind: platform
        semantics: '默认平台用户目录无法解析时失败，不使用当前目录或相对目录。'
      - code: CODEX_HOME_INVALID
        kind: platform
        semantics: '非空显式 CODEX_HOME 无效时失败且不得自动回退。'
    loading:
      states: [Idle, Loading, Ready, Empty, Failed, Cancelling]
      request_identity: '每次本地会话目录观察请求使用唯一递增标识。'
      stale_result_rule: 旧请求结果不得覆盖更新请求的状态或数据。
    timeout:
      behavior: 超时后进入 Failed 并终止本次有界 SQLite 观察。
      evidence: 只记录请求标识、耗时和稳定错误类别，不记录会话 ID、标题、数据库文件名或路径。
    cancellation:
      behavior: 取消后进入 Cancelling，停止 SQLite 查询并使旧结果失效。
      evidence: 只记录取消请求、清理完成和旧请求失效，不记录私人数据。
    isolation: '单个来源失败只能形成 Partial 或整体 Failed，不得污染其他来源、请求或稳定页面。'
    observability:
      - request_identity
      - discovered_source_count
      - readable_source_count
      - failed_source_count
      - source_coverage
      - entry_count
      - has_more
      - duration_ms
      - outcome_class
    platforms:
      shared_semantics: '从平台 CODEX_HOME 或合法非空 CODEX_SQLITE_HOME 发现最多 32 个直接普通 SQLite 候选，以只读 OpenFlags 和 query_only 观察 threads 或 automation_runs，跨库排序去重后按默认 50、最大 100 分页。'
      windows: 使用 Windows 平台路径适配器与共享 SQLite 合同；非法显式根明确失败。
      macos: 使用 macOS 平台路径适配器与共享 SQLite 合同；非法显式根明确失败。
      differences: []
    fixture_policy:
      mode: required
      reason: '使用合成 fixture 固定分页、最小字段、跨来源去重、Partial 覆盖和隐私边界，不包含真实会话或私人路径。'
    fixture_refs:
      - fixture.feature.session-data.local-session-directory-observation.baseline
  - id: contract.feature.session-data.local-session-management.baseline
    feature_id: feature.session-data.local-session-management
    scenario: baseline
    preconditions:
      - '上游 Release v1.2.44 证据已锁定，所需平台适配器可用。'
    inputs:
      - name: request
        data_type: local-session-management-request
        required: false
        description: '结构化请求；可包含合法 CODEX_SQLITE_HOME、候选数据库集合、会话标识与删除或撤销操作。'
      - name: candidate_databases
        data_type: database-path-list
        required: false
        description: '按平台发现的受支持 SQLite 路径集合；只允许现存、已批准的本地数据库。'
    outputs:
      - name: result
        data_type: local-session-management-result
        description: '返回跨库命中数、稳定状态与可选 grouped-undo-token；无会话时返回明确空结果。'
      - name: undo_window
        data_type: undo-window-state
        description: '删除期间保持可撤销窗口；撤销成功后刷新并关闭已消费窗口。'
    side_effects:
      - database-read
      - database-write
      - filesystem-write
    persistence: '删除先为每个来源数据库和关联文件建立恢复证据；撤销对全部数据库预检成功后才写回，任何失败都不得形成部分恢复。'
    errors:
      - code: LOCAL_SESSION_MANAGEMENT_FAILED
        kind: feature
        semantics: '本地会话与项目管理失败时返回稳定错误分类，不伪造空成功。'
      - code: LOCAL_SESSION_UNDO_PREFLIGHT_FAILED
        kind: validation
        semantics: '任一数据库 schema、行或文件恢复预检失败时，全部数据库保持未恢复状态。'
      - code: LOCAL_SESSION_UNDO_PATH_REJECTED
        kind: policy
        semantics: 'grouped-undo-token 引用的来源数据库不在 allowed-db-paths 时拒绝写回。'
    loading:
      states: [Idle, Loading, Ready, Empty, Failed, Cancelling]
      request_identity: '每次本地会话与项目管理请求使用唯一递增标识。'
      stale_result_rule: 旧请求结果不得覆盖更新请求的状态或数据。
    timeout:
      behavior: 超时后进入 Failed，终止本次工作并保留稳定错误分类。
      evidence: 记录请求标识、耗时和错误类别，不记录凭据或私人路径。
    cancellation:
      behavior: 取消后进入 Cancelling，完成清理后回到 Idle，旧结果失效。
      evidence: 记录取消请求、清理完成和旧请求失效。
    isolation: '本地会话与项目管理单次失败不得污染其他 feature、请求或稳定状态。'
    observability:
      - request_identity
      - duration_ms
      - outcome_class
    platforms:
      shared_semantics: '支持合法 CODEX_SQLITE_HOME 和多数据库扫描；跨库删除生成 grouped-undo-token，撤销先全库预检、只写回 allowed-db-paths，并保持一致撤销窗口语义。'
      windows: 使用 Windows 平台适配器遵循共享语义；不支持时明确失败。
      macos: 使用 macOS 平台适配器遵循共享语义；不支持时明确失败。
      differences: []
    fixture_policy:
      mode: required
      reason: '使用合成 fixture 固定双数据库、全库预检、允许路径和撤销窗口语义，不包含真实会话或私人绝对路径。'
    fixture_refs:
      - fixture.feature.session-data.local-session-management.baseline
  - id: contract.feature.session-data.markdown-generation.baseline
    feature_id: feature.session-data.markdown-generation
    scenario: baseline
    preconditions:
      - '上游 Release v1.2.44 证据已锁定，Windows 或 macOS 平台路径适配器可用。'
      - '调用方提交的 session_id 来自既有本地会话目录。'
    inputs:
      - name: session_id
        data_type: markdown-generation-request
        required: true
        description: '非空、无空白或控制字符且不超过 256 UTF-8 bytes 的既有本地会话标识；不得携带路径或 Markdown 正文。'
    outputs:
      - name: completion
        data_type: LoadCompletion<SessionMarkdownDocument>
        description: '有可导出消息返回 LoadCompletion::Ready，合法零消息返回 LoadCompletion::Empty，来源、内容、资源或平台错误返回 LoadCompletion::Failed。'
      - name: document
        data_type: SessionMarkdownDocument
        description: '只返回 suggested_filename、内存 markdown 与 message_count；文件名不含完整 session_id，正文固定 LF 和结尾换行。'
    side_effects:
      - database-read
      - filesystem-read
    persistence: 'none'
    errors:
      - code: MARKDOWN_GENERATION_INVALID_SESSION_ID
        kind: validation
        semantics: '会话标识为空、含空白或控制字符、首尾不精确或超过 256 UTF-8 bytes 时失败。'
      - code: MARKDOWN_GENERATION_INVALID_SQLITE_HOME
        kind: validation
        semantics: '非空显式 CODEX_SQLITE_HOME 不是合法受支持目录时失败且不得回退。'
      - code: MARKDOWN_GENERATION_TOO_MANY_DATABASES
        kind: policy
        semantics: '直接普通 SQLite 候选超过 32 个时在打开数据库前失败。'
      - code: MARKDOWN_GENERATION_UNSUPPORTED_SCHEMA
        kind: validation
        semantics: '任一候选不具备受支持 threads 或 automation_runs 最小 schema 时阻断整次生成。'
      - code: MARKDOWN_GENERATION_UNAVAILABLE
        kind: feature
        semantics: '数据库打开、锁等待、查询、目录枚举或普通文件读取失败时返回脱敏不可用错误。'
      - code: MARKDOWN_GENERATION_INVALID_ROLLOUT
        kind: validation
        semantics: '显式或发现 rollout 为相对路径、越出固定根、符号链接、非普通 JSONL 或会话来源不可用时失败。'
      - code: MARKDOWN_GENERATION_INVALID_CONTENT
        kind: validation
        semantics: 'JSONL 非 UTF-8、malformed JSON、消息结构错误或声明的会话 ID 不匹配时失败，不返回部分文档。'
      - code: MARKDOWN_GENERATION_RESOURCE_LIMIT
        kind: policy
        semantics: 'rollout 深度 4、枚举 8192、候选 4096、metadata 前缀 8 KiB、发现累计 32 MiB、单 rollout 16 MiB、记录 100000、消息 20000、Markdown 16 MiB 或文件名 160 UTF-8 bytes 任一上限被突破时失败。'
      - code: MARKDOWN_GENERATION_TIMEOUT
        kind: feature
        semantics: '整体 2 s deadline 到期时停止生成并使结果失败；SQLite busy timeout 为 50 ms，progress interval 为 1000。'
      - code: MARKDOWN_GENERATION_CANCELLED
        kind: feature
        semantics: '取消标记生效后停止当前生成，旧请求结果不得发布。'
      - code: MARKDOWN_GENERATION_UNSUPPORTED
        kind: platform
        semantics: '非 Windows 与 macOS 平台调用系统适配器时明确报告不支持。'
      - code: USER_HOME_UNAVAILABLE
        kind: platform
        semantics: '默认平台用户目录无法解析时失败，不使用当前目录或相对目录。'
      - code: CODEX_HOME_INVALID
        kind: platform
        semantics: '非空显式 CODEX_HOME 无效时失败且不得自动回退。'
    loading:
      states: [Idle, Loading, Ready, Empty, Failed, Cancelling]
      request_identity: '每次 Markdown 生成请求使用唯一递增标识。'
      stale_result_rule: 旧请求结果不得覆盖更新请求的状态或数据。
    timeout:
      behavior: 整体 2 s deadline 到期后进入 Failed，中止 SQLite、rollout 与结果发布。
      evidence: 只记录请求标识、耗时、结构计数和稳定错误类别，不记录 session_id、标题、正文、URL、文件名或路径。
    cancellation:
      behavior: 取消后进入 Cancelling，停止有界读取并使旧结果失效。
      evidence: 只记录取消请求、清理完成和旧请求失效，不记录私人数据。
    isolation: '任一候选来源或 JSONL 记录失败都阻断本次生成，不得用较旧重复记录或部分消息冒充成功；单次失败不得污染其他请求。'
    observability:
      - request_identity
      - database_candidate_count
      - rollout_candidate_count
      - rollout_record_count
      - message_count
      - markdown_bytes
      - filename_bytes
      - duration_ms
      - outcome_class
    platforms:
      shared_semantics: '从平台 CODEX_HOME 或合法非空 CODEX_SQLITE_HOME 严格只读查询最多 32 个 SQLite 候选，在固定 sessions 或 archived_sessions 根内有界流式解析 rollout，生成 user/assistant 文本、不可联网图片占位、UTC 与 LF 逐字节确定的内存 Markdown。'
      windows: 使用 Windows 平台路径适配器、只读 SQLite 与共享确定性合同；不选择或保存输出文件。
      macos: 使用 macOS 平台路径适配器、只读 SQLite 与共享确定性合同；不选择或保存输出文件。
      differences: []
    fixture_policy:
      mode: required
      reason: '使用合成 fixture 固定只读来源、角色过滤、UTC、图片占位、安全文件名、内存结果和零持久化，不包含真实会话或私人路径。'
    fixture_refs:
      - fixture.feature.session-data.markdown-generation.baseline
  - id: contract.feature.session-data.provider-metadata-maintenance.baseline
    feature_id: feature.session-data.provider-metadata-maintenance
    scenario: baseline
    preconditions:
      - '上游 Release v1.2.44 证据已锁定，所需平台适配器可用。'
    inputs:
      - name: request
        data_type: provider-metadata-maintenance-request
        required: false
        description: '结构化请求；无参数时为空对象。'
    outputs:
      - name: result
        data_type: provider-metadata-maintenance-result
        description: 'Provider 元数据维护、SQLite catalog 修复与同步状态维护的稳定结果或明确空结果。'
      - name: sqlite_catalog_rows_inserted
        data_type: non-negative-integer
        description: '从 threads 修复到 local_thread_catalog 的新增行数，对外映射为 sqliteCatalogRowsInserted。'
      - name: catalog_sync_state
        data_type: provider-catalog-sync-state
        description: '包含 watermark、initial_build_complete 和 observation_sequence 的同步状态。'
    side_effects:
      - database-read
      - database-write
      - filesystem-write
    persistence: 'local_thread_catalog 与同步状态写入必须同事务提交，失败回滚且不删除原始 threads 数据。'
    errors:
      - code: PROVIDER_METADATA_MAINTENANCE_FAILED
        kind: feature
        semantics: 'Provider 元数据维护、catalog 修复或同步状态写入失败时返回稳定错误分类，不伪造空成功或错误计数。'
    loading:
      states: [Idle, Loading, Ready, Empty, Failed, Cancelling]
      request_identity: '每次Provider 元数据维护请求使用唯一递增标识。'
      stale_result_rule: 旧请求结果不得覆盖更新请求的状态或数据。
    timeout:
      behavior: 超时后进入 Failed，终止本次工作并保留稳定错误分类。
      evidence: 记录请求标识、耗时和错误类别，不记录凭据或私人路径。
    cancellation:
      behavior: 取消后进入 Cancelling，完成清理后回到 Idle，旧结果失效。
      evidence: 记录取消请求、清理完成和旧请求失效。
    isolation: 'Provider 元数据维护单次失败不得污染其他 feature、请求或稳定状态。'
    observability:
      - request_identity
      - sqlite_catalog_rows_inserted
      - observation_sequence
      - duration_ms
      - outcome_class
    platforms:
      shared_semantics: '未显式传入路径时遵循 CODEX_HOME；同步 metadata、从 threads 修复 local_thread_catalog、返回 sqlite_catalog_rows_inserted、维护 observation_sequence 并生成本地备份。'
      windows: 使用 Windows 平台适配器遵循共享语义；不支持时明确失败。
      macos: 使用 macOS 平台适配器遵循共享语义；不支持时明确失败。
      differences: []
    fixture_policy:
      mode: required
      reason: '使用合成 fixture 固定结构字段、边界值与引用关系。'
    fixture_refs:
      - fixture.feature.session-data.provider-metadata-maintenance.baseline
  - id: contract.feature.session-data.token-usage-history.baseline
    feature_id: feature.session-data.token-usage-history
    scenario: baseline
    preconditions:
      - '上游 Release v1.2.44 证据已锁定，所需平台适配器可用。'
    inputs:
      - name: request
        data_type: token-usage-history-request
        required: false
        description: '结构化请求；无参数时为空对象。'
    outputs:
      - name: result
        data_type: token-usage-history-result
        description: 'Token 用量历史的稳定结果或明确空结果。'
    side_effects:
      - database-read
      - filesystem-read
    persistence: '不持久化私人路径、凭据或真实会话内容。'
    errors:
      - code: TOKEN_USAGE_HISTORY_FAILED
        kind: feature
        semantics: 'Token 用量历史失败时返回稳定错误分类，不伪造空成功。'
    loading:
      states: [Idle, Loading, Ready, Empty, Failed, Cancelling]
      request_identity: '每次Token 用量历史请求使用唯一递增标识。'
      stale_result_rule: 旧请求结果不得覆盖更新请求的状态或数据。
    timeout:
      behavior: 超时后进入 Failed，终止本次工作并保留稳定错误分类。
      evidence: 记录请求标识、耗时和错误类别，不记录凭据或私人路径。
    cancellation:
      behavior: 取消后进入 Cancelling，完成清理后回到 Idle，旧结果失效。
      evidence: 记录取消请求、清理完成和旧请求失效。
    isolation: 'Token 用量历史单次失败不得污染其他 feature、请求或稳定状态。'
    observability:
      - request_identity
      - duration_ms
      - outcome_class
    platforms:
      shared_semantics: '读取并规范化本地 Token 用量历史，不依赖 WebView 或注入。'
      windows: 使用 Windows 平台适配器遵循共享语义；不支持时明确失败。
      macos: 使用 macOS 平台适配器遵循共享语义；不支持时明确失败。
      differences: []
    fixture_policy:
      mode: required
      reason: '使用合成 fixture 固定结构字段、边界值与引用关系。'
    fixture_refs:
      - fixture.feature.session-data.token-usage-history.baseline
