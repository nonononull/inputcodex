[workspace]
resolver = "3"
members = [
    "apps/inputcodex-desktop",
    "crates/inputcodex-domain",
    "crates/inputcodex-application",
    "crates/inputcodex-infrastructure",
    "crates/inputcodex-platform",
    "crates/inputcodex-presentation",
    "crates/inputcodex-parity",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "AGPL-3.0-only"
repository = "https://github.com/nonononull/inputcodex"

[workspace.dependencies]
inputcodex-domain = { path = "crates/inputcodex-domain" }
inputcodex-application = { path = "crates/inputcodex-application" }
inputcodex-infrastructure = { path = "crates/inputcodex-infrastructure" }
inputcodex-platform = { path = "crates/inputcodex-platform" }
inputcodex-presentation = { path = "crates/inputcodex-presentation" }
inputcodex-parity = { path = "crates/inputcodex-parity" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.149"
toml_edit = { version = "=0.25.13", default-features = false, features = ["parse"] }
rusqlite = { version = "=0.40.1", default-features = false, features = ["bundled", "hooks"] }
yaml_serde = "=0.10.4"
iced = { version = "=0.14.0", default-features = false, features = [
    "wgpu",
    "thread-pool",
    "x11",
    "wayland",
] }
windows = { version = "=0.58.0", default-features = false, features = [
    "ApplicationModel",
    "Foundation_Collections",
    "Management_Deployment",
    "Storage",
] }
windows-registry = "=0.6.1"

[workspace.lints.rust]
unsafe_code = "forbid"
